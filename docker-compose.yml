services:
  # PostgreSQL Database
  database:
    image: postgres:15-alpine
    container_name: dnd-database
    environment:
      POSTGRES_DB: dnd_campaign_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dnd_password_2024
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - dnd-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dnd_campaign_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: dnd-api
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: dnd_campaign_db
      DB_USER: postgres
      DB_PASSWORD: dnd_password_2024
      JWT_SECRET: your_super_secret_jwt_key_change_in_production
      FRONTEND_URL: http://localhost:3000
    volumes:
      - api_uploads:/app/uploads
    ports:
      - "3001:3001"
    networks:
      - dnd-network
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: dnd-frontend
    environment:
      REACT_APP_API_URL: http://localhost:3001/api
    ports:
      - "3000:80"
    networks:
      - dnd-network
    depends_on:
      - api
    restart: unless-stopped

  # Development API (optional - for development with hot reload)
  api-dev:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: dnd-api-dev
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: dnd_campaign_db
      DB_USER: postgres
      DB_PASSWORD: dnd_password_2024
      JWT_SECRET: your_super_secret_jwt_key_change_in_production
      FRONTEND_URL: http://localhost:3000
    volumes:
      - ./api:/app
      - api_uploads:/app/uploads
      - /app/node_modules
    ports:
      - "3002:3001"
    networks:
      - dnd-network
    depends_on:
      database:
        condition: service_healthy
    command: npm run dev
    profiles:
      - dev

volumes:
  postgres_data:
    driver: local
  api_uploads:
    driver: local

networks:
  dnd-network:
    driver: bridge
