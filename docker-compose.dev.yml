services:
  # PostgreSQL Database (same as production)
  database:
    image: postgres:15-alpine
    container_name: dnd-database-dev
    environment:
      POSTGRES_DB: dnd_campaign_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dnd_password_2024
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - dnd-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dnd_campaign_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Development API with hot reload
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: dnd-api-dev
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: dnd_campaign_db
      DB_USER: postgres
      DB_PASSWORD: dnd_password_2024
      JWT_SECRET: dev_jwt_secret_key
      FRONTEND_URL: http://localhost:3000
    volumes:
      - ./api:/app
      - api_uploads_dev:/app/uploads
      - /app/node_modules
    ports:
      - "3001:3001"
    networks:
      - dnd-network
    depends_on:
      database:
        condition: service_healthy
    command: npm run dev
    restart: unless-stopped

  # Development Frontend (runs on host, not in container)
  # This allows for hot reload and better development experience
  # Run: npm start in the root directory

volumes:
  postgres_data_dev:
    driver: local
  api_uploads_dev:
    driver: local

networks:
  dnd-network:
    driver: bridge
