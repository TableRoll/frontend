services:
  # PostgreSQL Database
  database:
    image: postgres:15-alpine
    container_name: dnd-database
    environment:
      POSTGRES_DB: dnd_campaign_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dnd_password_2024
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - dnd-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dnd_campaign_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: dnd-api
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: dnd_campaign_db
      DB_USER: postgres
      DB_PASSWORD: dnd_password_2024
      JWT_SECRET: your_super_secret_jwt_key_change_in_production
      FRONTEND_URL: http://localhost:3000
      ALLOW_DEV_TOKEN: "true"
    volumes:
      - api_uploads:/app/uploads
    ports:
      - "3001:3001"
    networks:
      - dnd-network
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: dnd-frontend
    environment:
      REACT_APP_API_URL: http://localhost:3001/api
    ports:
      - "3000:80"
    networks:
      - dnd-network
    depends_on:
      - api
    restart: unless-stopped

  # Development API (optional - for development with hot reload)
  api-dev:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: dnd-api-dev
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: dnd_campaign_db
      DB_USER: postgres
      DB_PASSWORD: dnd_password_2024
      JWT_SECRET: your_super_secret_jwt_key_change_in_production
      FRONTEND_URL: http://localhost:3000
    volumes:
      - ./api:/app
      - api_uploads:/app/uploads
      - /app/node_modules
    ports:
      - "3002:3001"
    networks:
      - dnd-network
    depends_on:
      database:
        condition: service_healthy
    command: npm run dev
    profiles:
      - dev

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: dnd-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - dnd-network
    restart: unless-stopped

  # Grafana - Metrics Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: dnd-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3002
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource,grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3002:3000"
    networks:
      - dnd-network
    depends_on:
      - prometheus
    restart: unless-stopped

  # Node Exporter - System metrics (CPU, RAM, Disk)
  # Note: On Windows/Docker Desktop, this monitors the Docker VM, not Windows host
  node-exporter:
    image: prom/node-exporter:latest
    container_name: dnd-node-exporter
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - '/:/host:ro'
    ports:
      - "9100:9100"
    networks:
      - dnd-network
    restart: unless-stopped

  # cAdvisor - Container metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: dnd-cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    networks:
      - dnd-network
    restart: unless-stopped
    devices:
      - /dev/kmsg

  # Postgres Exporter - Database metrics
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: dnd-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:dnd_password_2024@database:5432/dnd_campaign_db?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - dnd-network
    depends_on:
      - database
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  api_uploads:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  dnd-network:
    driver: bridge
